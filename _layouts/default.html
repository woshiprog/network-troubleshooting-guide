<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <meta name="robots" content="index,follow,max-image-preview:large">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
    <meta name="theme-color" content="#102928">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到正文</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="网络故障排查指南首页">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>网络故障排查指南</span>
        </a>

        <nav class="site-nav" aria-label="主要导航">
          <a href="{{ '/' | relative_url }}">开始排查</a>
          <a href="{{ '/network-quality/' | relative_url }}">网络质量</a>
          <a href="{{ '/about/' | relative_url }}">关于本站</a>
        </nav>
      </div>
    </header>

    <main id="main-content" class="page-shell{% if page.layout_class %} {{ page.layout_class }}{% endif %}">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div>
        <strong>网络故障排查指南</strong>
        <p>按现象确认影响范围，从低风险检查开始，并记录每次测试结果。</p>
      </div>

      <div class="footer-links">
        <a href="{{ '/' | relative_url }}">开始排查</a>
        <a href="{{ '/about/' | relative_url }}">内容范围</a>
      </div>
    </footer>
  </body>
</html>
